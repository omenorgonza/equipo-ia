name: tablero-pr
# PR integrada en la rama objetivo con pruebas verdes → issue en Done (sin depender del PC local).
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
  pull-requests: read
jobs:
  done:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Mover a Done si procede
        env:
          GH_TOKEN: ${{ secrets.TABLERO_TOKEN }}
          TABLERO_OWNER: ${{ vars.TABLERO_OWNER }}
          TABLERO_NUMERO: ${{ vars.TABLERO_NUMERO }}
        run: python .equipo-ia/sincronizar.py pr-cerrada --pr ${{ github.event.pull_request.number }}
