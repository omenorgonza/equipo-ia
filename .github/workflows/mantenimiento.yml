name: mantenimiento
# Revisión semanal (lunes 06:17 UTC; cambia la línea cron para otra frecuencia) y ejecución manual.
# Pausar sin borrar: variable del repo MANTENIMIENTO_ACTIVO=false.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      simulacion:
        description: Añadir un aviso simulado (identificado como tal)
        type: choice
        options: [ninguna, aviso, aviso-modificado]
        default: ninguna
permissions:
  contents: read
concurrency:
  group: mantenimiento
  cancel-in-progress: false
jobs:
  revisar:
    if: vars.MANTENIMIENTO_ACTIVO != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comprobar acceso (identidad real del workflow)
        env:
          GH_TOKEN: ${{ secrets.TABLERO_TOKEN }}
          TABLERO_OWNER: ${{ vars.TABLERO_OWNER }}
          TABLERO_NUMERO: ${{ vars.TABLERO_NUMERO }}
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys
          sys.path.insert(0, ".equipo-ia")
          import tablero_lib as T
          n = os.environ.get("TABLERO_NUMERO")
          print("## Acceso del workflow (secreto TABLERO_TOKEN)\n\n| Recurso | OK | Detalle | Permiso mínimo |\n|---|---|---|---|")
          for r in T.comprobar_acceso(os.environ["GITHUB_REPOSITORY"], os.environ.get("TABLERO_OWNER", ""), int(n) if n else None):
              print(f"| {r['recurso']} | {'✅' if r['ok'] else '❌'} | {r['detalle']} | {r['permiso_minimo']} |")
          PY
      - name: Revisión de mantenimiento
        env:
          GH_TOKEN: ${{ secrets.TABLERO_TOKEN }}
          TABLERO_OWNER: ${{ vars.TABLERO_OWNER }}
          TABLERO_NUMERO: ${{ vars.TABLERO_NUMERO }}
        run: python .equipo-ia/mantenimiento.py --simulacion "${{ inputs.simulacion || 'ninguna' }}"
      - name: Reconciliar PRO (detecta movimientos manuales y reversiones)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.TABLERO_TOKEN }}
          TABLERO_OWNER: ${{ vars.TABLERO_OWNER }}
          TABLERO_NUMERO: ${{ vars.TABLERO_NUMERO }}
        run: python .equipo-ia/sincronizar.py produccion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resumen-mantenimiento
          path: resumen-mantenimiento.json
